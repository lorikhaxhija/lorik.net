name: plan-WEATHERLAB.yml
on:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-lab
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_WEATHERLAB_PLAN_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Tofu
        uses: opentofu/setup-opentofu@v2
      - name: Tofu init
        run: tofu init
      - name: Tofu plan
        run: tofu plan
